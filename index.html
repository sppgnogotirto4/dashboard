<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="logo.ico" />
    <!-- Icon dihapus karena tidak dapat diakses di lingkungan ini -->
    <title>Sistem Monitoring Presensi | SPPG Nogotirto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border-top: 6px solid #f97316; /* Aksen Orange BGN */
        }

        .input-focus:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }
    </style>
</head>
<body>

    <div class="login-card p-10 rounded-2xl shadow-2xl w-full max-w-md border border-gray-200">
        <div class="flex justify-between items-center mb-10">
            <img src="logo-unuu.png" alt="Logo UNU" class="h-12 w-auto grayscale hover:grayscale-0 transition duration-300">
            <img src="logo-bgn.png" alt="Logo BGN" class="h-14 w-auto">
        </div>

        <div class="text-left mb-8">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight uppercase">
                Monitoring <span class="text-orange-500">System</span>
            </h1>
            <div class="h-1 w-12 bg-slate-800 mt-1"></div>
            <p class="text-slate-500 text-sm mt-3 font-semibold tracking-wide">
                SPPG NOGOTIRTO - YOGYAKARTA
            </p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[2px] mb-2 ml-1">
                    Authentication Key
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                        <i class="fas fa-shield-alt"></i>
                    </span>
                    <input type="password" id="passInput" 
                        class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-xl outline-none input-focus transition-all text-slate-800 font-bold tracking-widest" 
                        placeholder="••••••••">
                </div>
            </div>

            <button onclick="checkLogin()" 
                class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 group">
                <span>MASUK SISTEM</span>
                <i class="fas fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
            </button>
            
            <p id="errorMsg" class="text-red-500 text-xs font-bold mt-2 hidden animate-pulse text-center">
                <i class="fas fa-exclamation-circle mr-1"></i> Akses Ditolak: Sandi Tidak Valid
            </p>
        </div>

        <div class="mt-12 pt-6 border-t border-slate-100 flex justify-center">
            <div class="flex items-center gap-2 text-slate-300">
                <i class="fab fa-github"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest">Internal Access Only</span>
            </div>
        </div>
    </div>

    <script>
        // MASUKKAN URL DEPLOY GOOGLE APPS SCRIPT ANDA DI SINI
        const DASHBOARD_URL = "https://script.google.com/macros/s/AKfycbxdwvjEoFPCjTD9StVy2ue5x7Bmkku9Mja4Hbr7uufvBlHLr1-VEn0eTA-DCPnxIn28/exec";
        const SECRET_PASS = "ri170845";

        function checkLogin() {
            const input = document.getElementById('passInput').value;
            const error = document.getElementById('errorMsg');

            if (input === SECRET_PASS) {
                // Menambahkan efek loading sederhana sebelum pindah
                const btn = document.querySelector('button');
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> MEMVALIDASI...';
                window.location.href = DASHBOARD_URL;
            } else {
                error.classList.remove('hidden');
                document.getElementById('passInput').value = "";
                // Goyangkan input jika salah (efek shake)
                const inputEl = document.getElementById('passInput');
                inputEl.classList.add('border-red-500');
                setTimeout(() => inputEl.classList.remove('border-red-500'), 1000);
            }
        }

        document.getElementById('passInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkLogin();
        });
    </script>
</body>
</html>
